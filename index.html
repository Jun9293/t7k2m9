<title>오아후 가족여행</title>
<style>
:root{
  --ink:#1c2b2a; --ink-soft:#4b615f; --ink-faint:#8a9a97;
  --teal:#0f4c56; --teal-deep:#0a353c; --teal-line:#bcd6d2;
  --bg:#f4f7f4; --card:#fff; --line:#e2e8e4; --line2:#f0f3f0;
  --coral:#e08a52; --tip:#fdf1de; --tipL:#e7c48e; --tipT:#6b4a1a;
  --warn:#fdeaea; --warnL:#eab3b3; --warnT:#8a2b2b;
  --ok:#eef6f0; --okL:#bfe0c8; --okT:#1c6b3a;
  --chip:#e7f0ee; --blue:#e8f0f7; --blueL:#b9d2e8; --blueT:#1d4e73;
}
html[data-theme="dark"]{
  --ink:#e6ece9; --ink-soft:#9fb3af; --ink-faint:#6d817d;
  --teal:#5fb0b8; --teal-deep:#0d2529; --teal-line:#2c4d52;
  --bg:#0f1a1c; --card:#16262a; --line:#24393d; --line2:#1c2f33;
  --coral:#e8a374; --tip:#33291a; --tipL:#5c4a2c; --tipT:#e6c68f;
  --warn:#3a2222; --warnL:#5e3535; --warnT:#efb4b4;
  --ok:#1a2e22; --okL:#2f5540; --okT:#8fd3a8;
  --chip:#1f3438; --blue:#1a2b38; --blueL:#2f4c63; --blueT:#a8cbe6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;}
body{padding-bottom:78px;}
a{color:inherit;}

header.top{position:sticky;top:0;z-index:30;background:var(--teal-deep);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 14px 0;}
.hrow{display:flex;align-items:center;gap:8px;}
.hrow h1{margin:0;font-size:16px;font-weight:700;font-family:Georgia,serif;flex:1;}
.iconbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;
  border-radius:9px;width:34px;height:34px;font-size:15px;display:flex;align-items:center;justify-content:center;
  font-family:inherit;padding:0;}
.iconbtn:active{opacity:.7;}
.sub{margin:3px 0 0;font-size:11.5px;color:#a8c6c2;}
.searchwrap{padding:9px 0 0;display:none;}
.searchwrap.on{display:block;}
.searchwrap input{width:100%;padding:9px 11px;border-radius:9px;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.1);color:#fff;font-size:14px;font-family:inherit;}
.searchwrap input::placeholder{color:#8fb3ae;}
.tabs{display:flex;gap:4px;margin-top:9px;}
.tabs button{flex:1;padding:9px 2px 10px;background:none;border:none;color:#8fb3ae;font-size:11.5px;
  font-weight:700;font-family:inherit;border-bottom:2.5px solid transparent;}
.tabs button.on{color:#fff;border-bottom-color:var(--coral);}

main{padding:12px;max-width:660px;margin:0 auto;}
.pane{display:none;} .pane.on{display:block;}
section.blk{margin-bottom:14px;}
.blkt{font-size:11.5px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px 2px;}

.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 14px;}
.card+.card{margin-top:9px;}
.card h4{margin:0 0 7px;font-size:13.5px;font-weight:700;}
.card p{margin:0 0 7px;font-size:12.5px;line-height:1.65;color:var(--ink-soft);}
.card p:last-child{margin-bottom:0;}
.card ul{margin:0;padding-left:17px;font-size:12.5px;line-height:1.7;color:var(--ink-soft);}
.card ul li+li{margin-top:3px;}
.card b{color:var(--ink);}
.tone-tip{background:var(--tip);border-color:var(--tipL);} .tone-tip p,.tone-tip ul{color:var(--tipT);} .tone-tip b{color:var(--tipT);}
.tone-warn{background:var(--warn);border-color:var(--warnL);} .tone-warn p,.tone-warn ul{color:var(--warnT);} .tone-warn b{color:var(--warnT);}
.tone-ok{background:var(--ok);border-color:var(--okL);} .tone-ok p,.tone-ok ul{color:var(--okT);} .tone-ok b{color:var(--okT);}
.tone-blue{background:var(--blue);border-color:var(--blueL);} .tone-blue p,.tone-blue ul{color:var(--blueT);} .tone-blue b{color:var(--blueT);}

table.t{width:100%;border-collapse:collapse;font-size:12px;}
table.t th{text-align:left;font-weight:700;padding:5px 4px;border-bottom:1.5px solid var(--line);font-size:11px;color:var(--ink-soft);}
table.t td{padding:6px 4px;border-bottom:1px solid var(--line2);vertical-align:top;line-height:1.5;}
table.t tr:last-child td{border-bottom:none;}
table.t td.r{text-align:right;white-space:nowrap;font-weight:700;color:var(--okT);}

.nextup{background:var(--coral);color:#fff;border-radius:12px;padding:10px 13px;margin-bottom:12px;display:none;}
.nextup.on{display:block;}
.nextup .lbl{font-size:10.5px;font-weight:700;opacity:.9;letter-spacing:.05em;}
.nextup .val{font-size:14.5px;font-weight:700;margin-top:2px;}
.nextup .meta{font-size:11.5px;opacity:.92;margin-top:2px;}

.daynav{display:flex;gap:6px;overflow-x:auto;padding:0 0 9px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.daynav::-webkit-scrollbar{display:none;}
.daynav a{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;text-decoration:none;
  color:var(--ink-soft);background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:5px 9px;font-size:10px;min-width:40px;}
.daynav a b{font-size:13px;font-weight:700;color:var(--ink);}
.daynav a.out{border-color:var(--coral);}
.daynav a.today{background:var(--coral);border-color:var(--coral);color:#fff;}
.daynav a.today b{color:#fff;}

details.day{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:9px;overflow:hidden;scroll-margin-top:132px;}
details.day[open]{border-color:var(--teal-line);}
details.day.today{border-color:var(--coral);border-width:2px;}
details.day.hide{display:none;}
summary.ds{list-style:none;cursor:pointer;padding:12px 13px;display:flex;align-items:center;gap:10px;}
summary.ds::-webkit-details-marker{display:none;}
.badge{flex:0 0 auto;width:45px;height:45px;border-radius:11px;background:var(--teal);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Georgia,serif;}
details.day.today .badge{background:var(--coral);}
.badge .n{font-size:15px;font-weight:700;line-height:1;} .badge .d{font-size:9px;opacity:.85;margin-top:1px;}
.st{flex:1;min-width:0;}
.st .dt{font-size:11.5px;color:var(--ink-soft);}
.st .hl{font-size:14px;font-weight:700;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.st .dc{font-size:10.5px;color:var(--okT);font-weight:700;margin-top:1px;}
.st .wx{font-size:10.5px;color:var(--ink-faint);margin-top:1px;}
.chev{flex:0 0 auto;color:var(--ink-faint);font-size:13px;transition:transform .15s;}
details.day[open] .chev{transform:rotate(90deg);}
.todaytag{display:inline-block;background:var(--coral);color:#fff;font-size:9.5px;font-weight:700;
  border-radius:20px;padding:1px 6px;margin-left:4px;vertical-align:1px;}

.dbody{padding:0 13px 13px;}
ol.tl{list-style:none;margin:4px 0 0;padding:0;border-left:2px solid var(--line);margin-left:6px;}
ol.tl li{position:relative;padding:0 0 13px 15px;}
ol.tl li::before{content:"";position:absolute;left:-6px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--teal);}
ol.tl li:last-child{padding-bottom:0;}
ol.tl li.done{opacity:.42;}
ol.tl li.done::before{background:var(--ink-faint);}
ol.tl li.done .act{text-decoration:line-through;}
.tm{font-size:11px;color:var(--coral);font-weight:700;}
.act{font-size:13.5px;font-weight:600;margin-top:1px;display:flex;align-items:flex-start;gap:5px;flex-wrap:wrap;}
.act .cb{flex:0 0 auto;width:17px;height:17px;margin:1px 2px 0 0;accent-color:var(--teal);}
.pl{font-size:12px;color:var(--ink-soft);margin-top:2px;line-height:1.5;}
.pl.food::before{content:"🍽 ";} .pl.car::before{content:"🚗 ";} .pl.walk::before{content:"🚶 ";}
a.lk{color:var(--ink);text-decoration:underline;text-decoration-color:var(--coral);text-underline-offset:2px;}
.tag{font-size:10px;border-radius:20px;padding:1px 6px;font-weight:700;white-space:nowrap;}
.tag.cost{background:var(--ok);color:var(--okT);border:1px solid var(--okL);}
.tag.tip{background:var(--tip);color:var(--tipT);border:1px solid var(--tipL);}
.tag.dur{background:var(--chip);color:var(--teal);border:1px solid var(--teal-line);}
.tag.ko{background:var(--blue);color:var(--blueT);border:1px solid var(--blueL);}
.tag.bb{background:#f6ecf7;color:#6b3a75;border:1px solid #ddc2e2;}
html[data-theme="dark"] .tag.bb{background:#2f2136;color:#dcb6e6;border-color:#4a3352;}
.nt{margin-top:5px;border-radius:8px;padding:6px 9px;font-size:11.5px;line-height:1.55;}
.nt.tip{background:var(--tip);border:1px solid var(--tipL);color:var(--tipT);}
.nt.warn{background:var(--warn);border:1px solid var(--warnL);color:var(--warnT);}
.nt.info{background:var(--chip);border:1px solid var(--teal-line);color:var(--teal);}
.nt.rain{background:var(--blue);border:1px solid var(--blueL);color:var(--blueT);}
.navbtn{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:11.5px;font-weight:700;color:#fff;
  background:var(--teal);border-radius:8px;padding:6px 10px;text-decoration:none;}

ul.ck{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
ul.ck li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line);}
ul.ck li:last-child{border-bottom:none;}
ul.ck input[type=checkbox]{width:18px;height:18px;margin-top:2px;flex:0 0 auto;accent-color:var(--teal);}
ul.ck .tx{flex:1;font-size:13px;line-height:1.45;}
ul.ck .tx small{display:block;color:var(--ink-soft);font-size:11px;margin-top:1px;}
ul.ck li.done .tx b{text-decoration:line-through;color:var(--ink-faint);}
.pr{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:20px;margin-right:4px;vertical-align:1px;}
.pr.hi{background:#fbe3d6;color:#a1461a;} .pr.mid{background:#fdf1de;color:#8a5a1a;} .pr.lo{background:var(--chip);color:var(--teal);}
html[data-theme="dark"] .pr.hi{background:#4a2a1a;color:#f0b48c;}
html[data-theme="dark"] .pr.mid{background:#3d3018;color:#e6c68f;}

.tool{display:flex;gap:6px;margin-bottom:7px;flex-wrap:wrap;}
.tool input,.tool select{font-size:14px;padding:8px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);color:var(--ink);font-family:inherit;min-width:0;flex:1;}
button.go{padding:9px 13px;font-size:13px;font-weight:700;color:#fff;background:var(--teal);
  border:none;border-radius:8px;font-family:inherit;}
button.gh{padding:9px 13px;font-size:12px;font-weight:700;color:var(--ink-soft);background:var(--card);
  border:1px solid var(--line);border-radius:8px;font-family:inherit;}
button:active{opacity:.8;}
.out{margin-top:8px;padding:9px 11px;background:var(--ok);border:1px solid var(--okL);border-radius:9px;
  font-size:13px;color:var(--okT);font-weight:700;line-height:1.6;}

.xl{list-style:none;margin:9px 0 0;padding:0;}
.xl li{display:flex;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px;align-items:flex-start;}
.xl .xm{flex:1;min-width:0;} .xl .xd{font-size:10.5px;color:var(--ink-soft);margin-top:1px;}
.xl .xa{font-weight:700;color:var(--okT);white-space:nowrap;font-size:12px;}
.xl .del{background:none;border:none;color:#b04a4a;font-size:14px;padding:0 2px;font-family:inherit;}
.tally{margin-top:9px;padding-top:9px;border-top:2px solid var(--okL);font-size:12.5px;}
.tally div{display:flex;justify-content:space-between;padding:3px 0;gap:10px;}
.tally .big{font-weight:700;font-size:13.5px;}
.tally .over{color:#b04a4a;} .tally .under{color:var(--okT);}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:60;background:var(--teal-deep);
  color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;}
.toast.show{opacity:1;}
.nores{text-align:center;padding:28px 12px;color:var(--ink-faint);font-size:13px;display:none;}
.nores.on{display:block;}
footer{max-width:660px;margin:16px auto 0;padding:0 16px;font-size:10.5px;color:var(--ink-faint);text-align:center;line-height:1.6;}
mark{background:var(--tip);color:var(--tipT);border-radius:3px;padding:0 1px;}
</style>
</head>
<body>

<header class="top">
  <div class="hrow">
    <h1>🌺 오아후 가족여행</h1>
    <button class="iconbtn" id="bsearch" aria-label="검색">🔍</button>
    <button class="iconbtn" id="btheme" aria-label="테마">🌙</button>
  </div>
  <p class="sub" id="hsub">2026.10.12 – 10.23 · 아기 19개월</p>
  <div class="searchwrap" id="sw"><input type="search" id="q" placeholder="식당·장소·활동 검색"></div>
  <div class="tabs">
    <button data-t="sch" class="on">📅 일정</button>
    <button data-t="info">🗺 정보</button>
    <button data-t="prep">🎒 준비</button>
    <button data-t="money">💰 지출</button>
  </div>
</header>

<main>
  <div class="pane on" id="p-sch">
    <div class="nextup" id="nextup"></div>
    <div class="daynav" id="daynav"></div>
    <div id="days"></div>
    <div class="nores" id="nores">검색 결과가 없습니다</div>
  </div>
  <div class="pane" id="p-info"></div>
  <div class="pane" id="p-prep"></div>
  <div class="pane" id="p-money"></div>
</main>

<footer>오프라인에서도 작동합니다 · 체크 상태는 이 기기에 저장됩니다<br>홈 화면에 추가하면 앱처럼 열립니다</footer>

function todayStr(){
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}
// 표시 시각 → 대략 시(hour). 정렬·다음일정 계산용
function hourOf(t){
  if(!t) return null;
  const m = String(t).match(/(\d{1,2}):(\d{2})/);
  if(m) return +m[1] + (+m[2])/60;
  const m2 = String(t).match(/^(\d{1,2})~/);
  if(m2) return +m2[1];
  const map = {"새벽":5,"새벽~아침":6,"아침":8,"오전":9.5,"도착":11,"도착 후":11,"정오":12,"점심":12.5,
    "오후":14.5,"늦은 오후":16.5,"저녁":18.5,"종일":10,"공항":11,"참고":null};
  for(const k in map){ if(String(t).indexOf(k)===0) return map[k]; }
  return null;
}

function itemHTML(it, di, ii){
  const id = di+'-'+ii;
  const on = doneItems.has(id);
  const cls = it.food?'food':(it.car?'car':(it.walk?'walk':''));
  const q = it.q || it.dest;
  const destL = it.dest ? `<a class="lk" href="${gmap(q)}" target="_blank" rel="noopener">${esc(it.dest)}</a>` : '';
  const detail = it.pl ? esc(it.pl) : '';
  const line = destL && detail ? `${destL} · ${detail}` : (destL || detail);
  const plHTML = line ? `<div class="pl ${cls}">${line}</div>` : '';
  let tags = '';
  if(it.lb)      tags += `<span class="tag cost">${esc(it.lb)}</span>`;
  if(it.dur)     tags += `<span class="tag dur">⏱ ${esc(it.dur)}</span>`;
  if(it.tipReq)  tags += `<span class="tag tip">💵 팁</span>`;
  if(it.cash)    tags += `<span class="tag tip">💴 ${esc(it.cash)}</span>`;
  if(it.ko)      tags += `<span class="tag ko">🇰🇷 한국어</span>`;

  if(it.resv)    tags += `<span class="tag tip">📞 예약</span>`;
  let nts = '';
  if(it.nt)   nts += `<div class="nt ${it.ntType||'info'}">${esc(it.nt)}</div>`;
  if(it.park) nts += `<div class="nt info">🅿️ ${esc(it.park)}</div>`;

    ? `<a class="navbtn" href="${gdir(q, it.walk?'walking':'driving')}" target="_blank" rel="noopener">🧭 길찾기</a>` : '';

}

    return;

  const now=new Date(), h=now.getHours()+now.getMinutes()/60;
  const d=DAYS[di];
  let found=null;

})();

function doSearch(term){
  term=term.trim().toLowerCase();
  const nr=document.getElementById('nores');
  let hits=0;
  document.querySelectorAll('details.day').forEach((det,i)=>{
    if(!term){ det.classList.remove('hide'); det.open = dayKey(DAYS[i])===TODAY; return; }
    const txt=det.textContent.toLowerCase();
    const hit=txt.indexOf(term)>=0;
    det.classList.toggle('hide',!hit);
    if(hit){ det.open=true; hits++; }
  });
  nr.classList.toggle('on', !!term && hits===0);
  navEl.style.display = term ? 'none' : '';
}

function reportText(){

  Object.keys(by).sort().forEach(c=> t+=`${c}: ${usd(by[c])} (${won(by[c])})\n`);

  t+=`\n현지 지출 합계: ${usd(tot)} (${won(tot)})\n`;
  t+=`항공권(원화 실결제): ₩4,327,600\n`;

  t+=`예상 총액 대비: ${(tot-TOTAL)>0?'초과':'여유'} ${usd(Math.abs(tot-TOTAL))}\n`;
  return t;
}
function copyText(txt, msg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast(msg),()=>fb());
  } else fb();
  function fb(){ const ta=document.createElement('textarea'); ta.value=txt;
    ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast(msg); }catch(e){ toast('복사 실패'); }
    document.body.removeChild(ta); }
}

/* ---------- 두 폰 기록 합치기 ---------- */
const CK_KEYS = ['main','cabin','hold'];
function packState(){
  return { v:1, exp:X, done:[...doneItems],
    ck: CK_KEYS.reduce((o,k)=>{ o[k]=LS.get('oahu-ck-'+k,[]); return o; }, {}) };
}
// 한글이 섞여도 안전하게 base64 인코딩
function b64enc(s){
  const b = new TextEncoder().encode(s);
  let t=''; b.forEach(c=> t+=String.fromCharCode(c));
  return btoa(t);
}
function b64dec(s){
  const bin = atob(s.trim());
  const arr = Uint8Array.from(bin, c=>c.charCodeAt(0));
  return new TextDecoder().decode(arr);
}
document.getElementById('syOut').addEventListener('click', ()=>{
  const code = 'OAHU1:' + b64enc(JSON.stringify(packState()));
  copyText(code, '코드 복사됨 — 카톡으로 보내세요');
});
document.getElementById('syInBtn').addEventListener('click', ()=>{
  const p=document.getElementById('syPanel');
  p.style.display = p.style.display==='none' ? 'block' : 'none';
  if(p.style.display==='block') document.getElementById('syText').focus();
});
document.getElementById('syGo').addEventListener('click', ()=>{
  const raw=document.getElementById('syText').value.trim();
  if(!raw){ toast('코드를 붙여넣으세요'); return; }
  let d;
  try{
    const body = raw.startsWith('OAHU1:') ? raw.slice(6) : raw;
    d = JSON.parse(b64dec(body));
    if(!d || typeof d!=='object') throw 0;
  }catch(e){ toast('코드를 읽을 수 없습니다'); return; }

  let addedExp=0, addedDone=0, addedCk=0;
  // 지출: id 기준 중복 제거
  if(Array.isArray(d.exp)){
    const have=new Set(X.map(e=>e.id));
    d.exp.forEach(e=>{ if(e && e.id && !have.has(e.id)){ X.push(e); have.add(e.id); addedExp++; } });
    LS.set('oahu-exp', X);
  }
  // 완료 체크: 합집합
  if(Array.isArray(d.done)){
    const before=doneItems.size;
    d.done.forEach(i=> doneItems.add(i));
    addedDone = doneItems.size - before;
    LS.set('oahu-done',[...doneItems]);
  }
  // 준비 체크리스트: 합집합
  if(d.ck && typeof d.ck==='object'){
    CK_KEYS.forEach(k=>{
      if(!Array.isArray(d.ck[k])) return;
      const cur=new Set(LS.get('oahu-ck-'+k,[])); const b=cur.size;
      d.ck[k].forEach(i=> cur.add(i));
      addedCk += cur.size - b;
      LS.set('oahu-ck-'+k,[...cur]);
    });
  }
  renderX(); renderDays();
  document.getElementById('syText').value='';
  document.getElementById('syPanel').style.display='none';
  toast(`지출 ${addedExp} · 체크 ${addedDone+addedCk}건 추가됨`);
  setTimeout(()=>location.reload(), 1400);
});

/* 체크리스트 공통 */
function bindCk(key, ul){
  let set=new Set(LS.get('oahu-ck-'+key, []));
  ul.querySelectorAll('input[type=checkbox]').forEach(b=>{
    if(set.has(+b.dataset.i)){ b.checked=true; b.closest('li').classList.add('done'); }
  });
  ul.addEventListener('change', e=>{
    const b=e.target.closest('input[type=checkbox]'); if(!b) return;
    const i=+b.dataset.i;
    b.checked?set.add(i):set.delete(i);
    b.closest('li').classList.toggle('done', b.checked);
    LS.set('oahu-ck-'+key,[...set]);
  });
}
(function(){
  const ul=document.getElementById('ckmain');
  ul.innerHTML = CHECK.map((c,i)=>
    `<li data-i="${i}"><input type="checkbox" data-i="${i}"><div class="tx">

  bindCk('main', ul);
  document.querySelectorAll('ul.ck[data-ck]').forEach(u=> bindCk(u.dataset.ck, u));
})();
